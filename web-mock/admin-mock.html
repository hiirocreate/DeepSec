<title>RiskView 管理画面モック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: fixed left rail (nav) + scrolling work area; summary first, tables below; rail becomes a top tab strip on phones. */
:root {
  --bg: #f3f6fa; --surface: #ffffff; --surface-2: #eaf0f6; --line: #d5dee9;
  --fg: #16233a; --muted: #5a6880; --brand: #012e75; --brand-fg: #ffffff; --cyan: #07e3db;
  --accent: #012e75; --accent-soft: #dfe9f8;
  --crit: #c62828; --crit-bg: #fde7e7; --high: #c2570c; --high-bg: #fdebdc;
  --med: #8a6a00; --med-bg: #fbf1c9; --low: #3d5a80; --low-bg: #e3ebf5;
  --ok: #17794b; --ok-bg: #dff3e8;
  --font: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif;
  --num: "Space Grotesk", "Noto Sans JP", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1424; --surface: #121e33; --surface-2: #1a2942; --line: #2a3b59;
  --fg: #e6edf7; --muted: #9aa9c0; --brand: #071a3d; --brand-fg: #ffffff; --cyan: #07e3db;
  --accent: #5fe9e3; --accent-soft: #123a4d;
  --crit: #ff8a80; --crit-bg: #4a1c1c; --high: #ffb074; --high-bg: #4a2a12;
  --med: #f0d264; --med-bg: #40380f; --low: #a9c1e4; --low-bg: #1f3352;
  --ok: #7ad9a6; --ok-bg: #123a29; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #121e33; --surface-2: #1a2942; --line: #2a3b59;
  --fg: #e6edf7; --muted: #9aa9c0; --brand: #071a3d; --brand-fg: #ffffff; --cyan: #07e3db;
  --accent: #5fe9e3; --accent-soft: #123a4d;
  --crit: #ff8a80; --crit-bg: #4a1c1c; --high: #ffb074; --high-bg: #4a2a12;
  --med: #f0d264; --med-bg: #40380f; --low: #a9c1e4; --low-bg: #1f3352;
  --ok: #7ad9a6; --ok-bg: #123a29; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--brand); color: var(--brand-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; align-self: start; height: 100vh; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand img { width: 38px; height: 38px; background: #fff; border-radius: 8px; padding: 3px; }
.brand b { font-family: var(--num); font-size: 20px; letter-spacing: .01em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: #c9d6ee; text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav a[aria-current="page"] { background: var(--cyan); color: #012e75; font-weight: 700; }
.nav .count { font-family: var(--num); font-size: 12px; background: rgba(255,255,255,.16); border-radius: 10px; padding: 0 7px; }
.nav a[aria-current="page"] .count { background: rgba(1,46,117,.16); }
.rail-foot { margin-top: auto; font-size: 12px; color: #c9d6ee; padding: 0 6px; }
.rail-foot b { display: block; color: #fff; font-size: 13px; }
.main { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.mock { background: var(--med-bg); color: var(--med); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; margin: 0; line-height: 1.3; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel > .body { padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi span { color: var(--muted); font-size: 12.5px; display: block; }
.kpi b { font-family: var(--num); font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; }
.kpi.alert b { color: var(--crit); } .kpi.warn b { color: var(--high); }
.two { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13.5px; }
.drawer table, .matrix { min-width: 0; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--surface-2); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; } .muted { color: var(--muted); } .small { font-size: 12.5px; }
.pill { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.sev-critical { background: var(--crit-bg); color: var(--crit); } .sev-high { background: var(--high-bg); color: var(--high); }
.sev-medium { background: var(--med-bg); color: var(--med); } .sev-low { background: var(--low-bg); color: var(--low); }
.st-ok { background: var(--ok-bg); color: var(--ok); } .st-bad { background: var(--crit-bg); color: var(--crit); }
.st-run { background: var(--accent-soft); color: var(--accent); } .st-wait { background: var(--surface-2); color: var(--muted); }
.st-warn { background: var(--high-bg); color: var(--high); }
.plan { font-family: var(--num); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.plan.PREMIUM { background: var(--cyan); color: #012e75; border-color: var(--cyan); }
.plan.STANDARD { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--muted); }
select, input[type="search"], input[type="number"], input[type="month"] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%; }
a.btn { text-decoration: none; display: inline-block; }
.btn { color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); } .btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 72px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
.bar i { display: block; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bar i u { display: block; height: 100%; border-radius: 5px; }
.meter { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.meter i { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: block; }
.meter i u { display: block; height: 100%; background: var(--accent); }
.dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13.5px; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; overflow-wrap: anywhere; }
.drawer { position: fixed; inset: 0; background: rgba(4, 12, 28, .5); display: flex; justify-content: flex-end; z-index: 20; }
.drawer > div { background: var(--surface); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.drawer h2 { font-size: 17px; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.hist li { border-left: 2px solid var(--line); padding-left: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 6px; z-index: 30; font-size: 13.5px; max-width: 90%; }
.matrix td, .matrix th { text-align: center; } .matrix td:first-child, .matrix th:first-child { text-align: left; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
svg text { font-family: var(--num); font-size: 10px; fill: var(--muted); }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); gap: 10px; overflow-x: auto; }
  .brand b { display: none; } .rail-foot { display: none; }
  .nav { flex-direction: row; } .nav a { white-space: nowrap; gap: 6px; padding: 7px 10px; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .drawer > div { animation: slide .16s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6 } } }
</style>

      '<section class="panel"><header><h2>対応状況の変更</h2></header><div class="filters" style="border:0"><label>対応状況<select id="d-status">' + STATUS.map(function (s) { return "<option" + (s === e.status ? " selected" : "") + ">" + s + "</option>"; }).join("") +
      '</select></label><label style="flex:1 1 180px">メモ<input type="search" id="d-note" placeholder="対応内容を記録"></label><span style="align-self:end"><button class="btn primary" data-act="setstatus" data-id="' + e.id + '">更新</button></span></div></section>' +
      "<div><h2 style=\"margin-bottom:8px\">対応履歴</h2>" + (e.hist.length ? '<ul class="hist">' + e.hist.map(function (h) { return '<li><span class="num muted">' + fmt(h.at) + "</span> " + esc(h.by) + "<br>" + h.from + " → <b>" + h.to + "</b>" + (h.note ? "：" + esc(h.note) : "") + "</li>"; }).join("") + "</ul>" : '<p class="note">まだ対応履歴はありません。</p>') + "</div></div>";
    $("drawer").hidden = false;
  }

  // ---------- routing & events ----------
  var NAV = [["dashboard", "ダッシュボード"], ["customers", "顧客管理"], ["findings", "検知情報"], ["jobs", "監視状況"], ["reports", "月次レポート"], ["system", "システム設定"]];
  function route() { var h = location.hash.replace("#", ""); return V[h] ? h : "dashboard"; }
  function render() {
    var r = route(), un = events.filter(function (e) { return e.status === "未対応"; }).length, jf = jobs.filter(function (j) { return j.status === "失敗"; }).length;
    $("nav").innerHTML = NAV.map(function (n) { var c = n[0] === "findings" ? un : n[0] === "jobs" ? jf : 0; return '<a href="#' + n[0] + '"' + (n[0] === r ? ' aria-current="page"' : "") + ">" + n[1] + (c ? '<span class="count">' + c + "</span>" : "") + "</a>"; }).join("");
    $("view").innerHTML = '<div class="wrap">' + V[r]() + "</div>";
  }
  window.addEventListener("hashchange", function () { state.page = 1; $("drawer").hidden = true; render(); window.scrollTo(0, 0); });
  document.addEventListener("click", function (ev) {
    var t = ev.target, row = t.closest("[data-ev]"), cust = t.closest("[data-cust]"), act = t.closest("[data-act]");
    if (t.id === "drawer") { $("drawer").hidden = true; return; }
    if (act) {
      var a = act.dataset.act;
      if (a === "closedrawer") $("drawer").hidden = true;
      else if (a === "prev") { state.page--; render(); } else if (a === "next") { state.page++; render(); }
      else if (a === "closecust") { state.cust = null; render(); }
      else if (a === "setstatus") {
        var e = events.filter(function (x) { return x.id === act.dataset.id; })[0], to = $("d-status").value;
        if (to === e.status) { toast("対応状況は変わっていません"); return; }
        e.hist.unshift({ at: NOW, by: "管理 太郎", from: e.status, to: to, note: $("d-note").value }); e.status = to; e.assignee = "管理 太郎"; if (to === "対応済み") e.state = "解消";
        render(); showEvent(e.id); toast("対応状況を「" + to + "」に更新しました（モックのため保存されません）");
      }
      else if (a === "csv") toast("本番ではサーバー側でCSVを生成してダウンロードします");
      else if (a === "pdf") toast("本番ではサーバー側で生成したPDFをダウンロードします");
      else if (a === "resend") toast("再送ジョブを登録しました（モック）");
      else if (a === "save") toast("設定を保存しました（モックのため保存されません）");
      else if (a === "new" || a === "edit") toast("登録・編集フォームは本実装で追加します");
      return;
    }
    if (row) { showEvent(row.dataset.ev); return; }
    if (cust) { state.cust = tenants.filter(function (x) { return x.id === cust.dataset.cust; })[0]; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") $("drawer").hidden = true;
    if (ev.key === "Enter" && ev.target.matches("tr.click")) ev.target.click();
  });
  document.addEventListener("change", function (ev) {
    var id = ev.target.id, m = { "f-tenant": "tenant", "f-sev": "sev", "f-kind": "kind", "f-status": "status", "f-days": "days" };
    if (m[id]) { state.f[m[id]] = ev.target.value; state.page = 1; render(); }
    else if (id === "jf") { state.jf = ev.target.value; render(); }
    else if (ev.target.dataset.ft) { var p = ev.target.dataset.ft.split(","); feat[+p[0]][+p[1]] = ev.target.checked; }
  });
  document.addEventListener("input", function (ev) {
    var id = ev.target.id; if (id !== "f-q" && id !== "cq") return;
    if (id === "f-q") { state.f.q = ev.target.value; state.page = 1; } else state.cq = ev.target.value;
    var pos = ev.target.selectionStart; render(); var el = $(id); el.focus(); el.setSelectionRange(pos, pos);
  });
  render();
})();
</script>
